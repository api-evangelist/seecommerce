description: SeeCommerce was a supply-chain performance management software company that provided
  analytics and management software focused on supply-chain visibility and problems. It raised roughly
  $47-58M across multiple venture rounds from investors including Insight Partners and Integral Capital
  Partners, and was acquired in February 2006. It was surfaced as a portfolio-lead stub of insight-partners
  and added to the API Evangelist network for enrichment. As of this enrichment pass the company is
  defunct/acquired with no live website, developer portal, or public API surface (seecommerce.com no
  longer resolves to the company and other candidate domains do not resolve), so there are no API
  artifacts to harvest.
